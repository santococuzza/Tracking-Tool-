<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Prime Business" />
<title>Prime Business &middot; Wochenrennen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0B0B0A; color: #EDE6D6; font-family: 'Inter', sans-serif; }
  .display { font-family: 'Playfair Display', serif; }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .gold { background: linear-gradient(135deg, #E8C878, #B4863A); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .hero { padding: 32px 20px 40px; border-bottom: 1px solid #201E15; text-align: center; }
  .hero img { height: 60px; margin-bottom: 14px; }
  .hero-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; text-align: left; }
  .eyebrow { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8C8672; margin: 0 0 2px; }
  .h1 { font-size: 30px; font-weight: 700; margin: 0; }
  .total { font-size: 24px; font-weight: 700; margin: 0; }
  .goal-row { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 6px; font-size: 12px; color: #8C8672; }
  .goal-row input { background: transparent; border: none; color: #EDE6D6; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: right; width: 90px; outline: none; }
  .bar-track { background: #201E15; border-radius: 999px; overflow: hidden; height: 10px; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.22,1,.36,1); background: linear-gradient(90deg,#B4863A,#E8C878); }
  .race { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
  .race-row { display: flex; align-items: center; gap: 12px; }
  .race-rank { font-size: 12px; color: #6B6653; width: 16px; font-family: 'JetBrains Mono', monospace; }
  .race-name { font-size: 14px; width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .race-track { flex: 1; background: #201E15; border-radius: 999px; overflow: hidden; height: 10px; }
  .race-fill { height: 100%; border-radius: 999px; transition: width .5s cubic-bezier(.22,1,.36,1); }
  .race-total { font-size: 12px; width: 70px; text-align: right; font-family: 'JetBrains Mono', monospace; }
  .flagnote { display: flex; align-items: center; gap: 6px; color: #6B6653; font-size: 11px; margin-top: 4px; }
  .content { padding: 28px 20px 60px; }
  .card { background: #141310; border: 1px solid #26231A; border-radius: 14px; padding: 18px; margin-bottom: 24px; }
  .card h2 { font-size: 18px; margin: 0 0 16px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 500; color: #6B6653; text-align: left; padding-bottom: 8px; }
  th.num, td.num { text-align: right; }
  td { padding: 6px 4px; border-top: 1px solid #201E15; }
  .name-input { font-family: 'Inter', sans-serif; background: transparent; border: 1px solid transparent; color: #EDE6D6; border-radius: 6px; padding: 6px 8px; width: 100%; font-size: 13px; }
  .name-input:hover { border-color: #2E2B1E; }
  .name-input:focus { outline: none; border-color: #C9A455; background: #1C1A12; }
  .num-input { font-family: 'JetBrains Mono', monospace; background: #1C1A12; border: 1px solid #2E2B1E; color: #EDE6D6; border-radius: 6px; padding: 6px 6px; width: 100%; min-width: 56px; font-size: 13px; text-align: right; }
  .num-input:focus { outline: 2px solid #C9A455; outline-offset: 1px; border-color: transparent; }
  .sum-cell { font-family: 'JetBrains Mono', monospace; font-weight: 600; white-space: nowrap; }
  .icon-btn { color: #6B6653; background: none; border: none; cursor: pointer; padding: 4px; display: inline-flex; align-items: center; }
  .icon-btn:hover { color: #C9A455; }
  .row-flex { display: flex; gap: 8px; margin-top: 14px; }
  .text-input { font-family: 'Inter', sans-serif; border: 1px solid #2E2B1E; border-radius: 8px; padding: 8px 10px; font-size: 13px; background: #1C1A12; color: #EDE6D6; flex: 1; min-width: 0; }
  .text-input::placeholder { color: #6B6653; }
  .text-input:focus { outline: 2px solid #C9A455; outline-offset: 1px; border-color: transparent; }
  .btn { background: linear-gradient(135deg,#E8C878,#B4863A); color: #14130D; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { filter: brightness(1.08); }
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid #201E15; }
  li:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .idea-text, .todo-text { font-size: 13px; flex: 1; }
  .votes { font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  .empty { font-size: 13px; color: #6B6653; }
  .checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #4A4737; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
  .checkbox.done { border: none; background: linear-gradient(135deg,#8FB893,#6E8F72); }
  .owner-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #1C1A12; color: #C9A455; }
  .save-note { font-size: 11px; color: #6B6653; }
</style>
</head>

const DAYS = ["Mo","Di","Mi","Do","Fr"];
const STORAGE_KEY = "prime-business-tracker-v1";
const uid = () => Math.random().toString(36).slice(2,9);

function isoWeekLabel(d = new Date()) {
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
  const week1 = new Date(date.getFullYear(), 0, 4);
  const weekNo = 1 + Math.round(((date - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return `KW ${weekNo} \u00b7 ${date.getFullYear()}`;
}
function fmtEUR(n) {
  return new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n || 0);
}

function defaultState() {
  return {
    weekLabel: isoWeekLabel(),
    weeklyGoal: 25000,
    members: [{id:uid(),name:"Anna"},{id:uid(),name:"Ben"},{id:uid(),name:"Chris"}],
    revenue: {},
    ideas: [],
    todos: [],
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...defaultState(), ...JSON.parse(raw) };
  } catch(e) {}
  return defaultState();
}

let state = loadState();

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function esc(s) {
  const d = document.createElement('div');
  d.innerText = s == null ? "" : s;
  return d.innerHTML;
}

function totalsFor() {
  const totals = state.members.map(m => {
    const days = state.revenue[m.id] || {};
    const total = DAYS.reduce((s,d) => s + (Number(days[d]) || 0), 0);
    return { ...m, total };
  });
  return totals;
}

function render() {
  const totals = totalsFor();
  const teamTotal = totals.reduce((s,m) => s + m.total, 0);
  const goalPct = state.weeklyGoal ? Math.min(100, (teamTotal / state.weeklyGoal) * 100) : 0;
  const maxTotal = Math.max(state.weeklyGoal, ...totals.map(t=>t.total), 1);
  const perHead = state.weeklyGoal / Math.max(totals.length, 1);
  const sorted = [...totals].sort((a,b) => b.total - a.total);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="hero">
      <img src="${LOGO_SRC}" alt="Prime Business" />
      <div class="hero-row">
        <div>
          <p class="eyebrow">Wochenrennen</p>
          <h1 class="h1 display gold">${esc(state.weekLabel)}</h1>
        </div>
        <div style="text-align:right;">
          <p class="eyebrow">Teamumsatz</p>
          <p class="total mono gold">${fmtEUR(teamTotal)}</p>
        </div>
      </div>
      <div class="goal-row">
        <span>Ziel</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <input id="goalInput" type="number" value="${state.weeklyGoal}" />
          <span>&middot; ${goalPct.toFixed(0)}%</span>
        </span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${goalPct}%"></div></div>

      <div class="race">
        ${sorted.map((m,i) => `
          <div class="race-row">
            <span class="race-rank">${i+1}</span>
            <span class="race-name">${esc(m.name)}</span>
            <div class="race-track"><div class="race-fill" style="width:${(m.total/maxTotal)*100}%; background:${m.total >= perHead ? 'linear-gradient(90deg,#6E8F72,#8FB893)' : '#4A4737'}"></div></div>
            <span class="race-total mono">${fmtEUR(m.total)}</span>
          </div>
        `).join("")}
        <div class="flagnote">&#9873; Zielmarke pro Kopf: ${fmtEUR(perHead)}</div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 class="display gold">Tagesumsatz</h2>
          <span class="save-note" id="saveNote"></span>
        </div>
        <div style="overflow-x:auto;">
        <table>
          <thead><tr>
            <th>Name</th>
            ${DAYS.map(d=>`<th class="num">${d}</th>`).join("")}
            <th class="num">Summe</th>
            <th></th>
          </tr></thead>
          <tbody>
            ${state.members.map(m => {
              const days = state.revenue[m.id] || {};
              const total = DAYS.reduce((s,d)=>s+(Number(days[d])||0),0);
              return `<tr>
                <td><input class="name-input" data-role="name" data-id="${m.id}" type="text" value="${esc(m.name)}" /></td>
                ${DAYS.map(d => `<td><input class="num-input" data-role="rev" data-id="${m.id}" data-day="${d}" type="number" placeholder="0" value="${days[d] ?? ""}" /></td>`).join("")}
                <td class="num sum-cell gold">${fmtEUR(total)}</td>
                <td><button class="icon-btn" data-role="rm-member" data-id="${m.id}" aria-label="entfernen">&#10005;</button></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
        </div>
        <div class="row-flex">
          <input class="text-input" id="newMember" placeholder="Name hinzuf\u00fcgen" />
          <button class="btn" id="addMember">+ Hinzuf\u00fcgen</button>
        </div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2 class="display gold">Meeting-Ideen</h2>
          <div class="row-flex" style="margin-top:0;margin-bottom:14px;">
            <input class="text-input" id="newIdea" placeholder="Idee eintragen\u2026" />
            <button class="btn" id="addIdea">+</button>
          </div>
          ${state.ideas.length === 0 ? `<p class="empty">Noch keine Ideen gesammelt.</p>` : `
          <ul>
            ${[...state.ideas].sort((a,b)=>b.votes-a.votes).map(idea => `
              <li>
                <span class="idea-text">${esc(idea.text)}</span>
                <button class="icon-btn" data-role="vote" data-id="${idea.id}">&#9650; <span class="votes">${idea.votes}</span></button>
                <button class="icon-btn" data-role="rm-idea" data-id="${idea.id}">&#10005;</button>
              </li>
            `).join("")}
          </ul>`}
        </div>

        <div class="card">
          <h2 class="display gold">To-Dos</h2>
          <div class="row-flex" style="margin-top:0;margin-bottom:14px;">
            <input class="text-input" id="newTodo" placeholder="Aufgabe\u2026" />
            <input class="text-input" id="newTodoOwner" placeholder="Wer" style="flex:0 0 64px;" />
            <button class="btn" id="addTodo">+</button>
          </div>
          ${state.todos.length === 0 ? `<p class="empty">Keine offenen Aufgaben.</p>` : `
          <ul>
            ${state.todos.map(todo => `
              <li>
                <button class="checkbox ${todo.done ? 'done' : ''}" data-role="toggle-todo" data-id="${todo.id}">${todo.done ? '&#10003;' : ''}</button>
                <span class="todo-text" style="${todo.done ? 'text-decoration:line-through;color:#6B6653;' : ''}">${esc(todo.text)}</span>
                ${todo.owner ? `<span class="owner-tag">${esc(todo.owner)}</span>` : ""}
                <button class="icon-btn" data-role="rm-todo" data-id="${todo.id}">&#10005;</button>
              </li>
            `).join("")}
          </ul>`}
        </div>
      </div>
    </div>
  `;

  attachHandlers();
}

function attachHandlers() {
  const q = (sel) => document.querySelector(sel);
  const qa = (sel) => document.querySelectorAll(sel);

  q('#goalInput').addEventListener('change', e => {
    state.weeklyGoal = Number(e.target.value) || 0;
    save(); render();
  });

  qa('[data-role="name"]').forEach(el => el.addEventListener('input', e => {
    const id = e.target.dataset.id;
    state.members = state.members.map(m => m.id === id ? { ...m, name: e.target.value } : m);
    save();
  }));
  qa('[data-role="name"]').forEach(el => el.addEventListener('blur', () => render()));

  qa('[data-role="rev"]').forEach(el => el.addEventListener('input', e => {
    const id = e.target.dataset.id, day = e.target.dataset.day, val = e.target.value;
    if (!state.revenue[id]) state.revenue[id] = {};
    state.revenue[id][day] = val === "" ? "" : Number(val);
    save();
    updateTotalsOnly();
  }));
  qa('[data-role="rev"]').forEach(el => el.addEventListener('blur', () => render()));

  qa('[data-role="rm-member"]').forEach(el => el.addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    state.members = state.members.filter(m => m.id !== id);
    delete state.revenue[id];
    save(); render();
  }));

  q('#addMember').addEventListener('click', () => {
    const input = q('#newMember');
    if (!input.value.trim()) return;
    state.members.push({ id: uid(), name: input.value.trim() });
    save(); render();
  });
  q('#newMember').addEventListener('keydown', e => { if (e.key === 'Enter') q('#addMember').click(); });

  q('#addIdea').addEventListener('click', () => {
    const input = q('#newIdea');
    if (!input.value.trim()) return;
    state.ideas.unshift({ id: uid(), text: input.value.trim(), votes: 0 });
    save(); render();
  });
  q('#newIdea').addEventListener('keydown', e => { if (e.key === 'Enter') q('#addIdea').click(); });

  qa('[data-role="vote"]').forEach(el => el.addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    state.ideas = state.ideas.map(i => i.id === id ? { ...i, votes: i.votes + 1 } : i);
    save(); render();
  }));
  qa('[data-role="rm-idea"]').forEach(el => el.addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    state.ideas = state.ideas.filter(i => i.id !== id);
    save(); render();
  }));

  q('#addTodo').addEventListener('click', () => {
    const input = q('#newTodo'), owner = q('#newTodoOwner');
    if (!input.value.trim()) return;
    state.todos.unshift({ id: uid(), text: input.value.trim(), owner: owner.value.trim(), done: false });
    save(); render();
  });
  q('#newTodo').addEventListener('keydown', e => { if (e.key === 'Enter') q('#addTodo').click(); });

  qa('[data-role="toggle-todo"]').forEach(el => el.addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    state.todos = state.todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
    save(); render();
  }));
  qa('[data-role="rm-todo"]').forEach(el => el.addEventListener('click', e => {
    const id = e.currentTarget.dataset.id;
    state.todos = state.todos.filter(t => t.id !== id);
    save(); render();
  }));
}

function updateTotalsOnly() {
  const totals = totalsFor();
  const teamTotal = totals.reduce((s,m) => s + m.total, 0);
  const goalPct = state.weeklyGoal ? Math.min(100, (teamTotal / state.weeklyGoal) * 100) : 0;
  document.querySelectorAll('.total')[0].textContent = fmtEUR(teamTotal);
  // Full re-render on blur is enough for race bars; keep it simple & robust:
}

document.addEventListener('DOMContentLoaded', render);
if (document.readyState !== 'loading') render();
</script>
</body>
</html>
